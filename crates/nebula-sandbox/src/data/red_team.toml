# Red-team fixture for the Red_Team_Test (Requirements 7.1, 7.2, 7.6).
#
# Every entry pairs exactly one command string with exactly one expected tier and the
# category it exercises. These commands are DATA ONLY — they are never executed. The test
# in task 8.2 parses this file, classifies each `command`, and asserts the resulting tier
# matches `expected_tier`; it also asserts every required category is represented.
#
# Required categories (asserted by the test, use these exact strings):
#   deletes, format, diskpart, registry, git-force-push, curl-pipe-sh,
#   encoded-powershell, path-tricks, chained.
#
# The dangerous cases are Tier 3 (System). A few benign Tier-0/1 controls are included to
# pin that ordinary commands are not misclassified upward.

