# `git status` is NOT a benign Tier-0 control: `git` names only the push/reset-hard rules, so an
# unrecognized subcommand (`status`) is an unknown token the engine fails closed to System under
# the strict unknown-token policy (Req 1.6, 3.1). An engine unit test
# (`git_status_unknown_subcommand_still_known_command_but_no_rule_is_system`) pins this, so the
# faithful expected tier is System (3) and we must NOT add a git-status rule to lower it.
[[entry]]
command = "git status"
expected_tier = 3
category = "git-force-push"
