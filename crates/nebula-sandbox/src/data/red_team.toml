# --- path-tricks -----------------------------------------------------------------------

# Relative worktree escape: the leading `..\..` climbs above the worktree root, so the embedded
# lexical resolver reports WorktreeEscape (the `C:` is a MIDDLE segment, not a leading drive
# prefix, so the retired-drive check does not fire). A non-destructive read outside the worktree
# is Workspace (Req 2.5) via the path-aware read rule. Faithful engine output: Workspace (2),
# which still refuses the read without an approval.
[[entry]]
command = "cat ..\\..\\C:\\Windows\\System32\\config\\SAM"
expected_tier = 2
category = "path-tricks"

[[entry]]
command = "type C:\\Windows\\System32\\drivers\\etc\\hosts"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "rm ../../../etc/passwd"
expected_tier = 3
category = "path-tricks"

# Absolute (root-anchored) worktree escape reading a sensitive file outside the worktree. The
# lexical resolver treats a leading `\` as an absolute path it cannot prove is inside the
# (possibly relative/differently-cased) root, so it fails safe to WorktreeEscape; a non-destructive
# read there is Workspace (Req 2.5). Faithful engine output: Workspace (2).
#
# NOTE on the earlier POSIX form `cat /etc/shadow`: a `/`-leading argument is indistinguishable
# from a flag to the engine's `is_flag` (`-`/`/` prefix), so it is dropped from the path targets
# and the read stays Tier 0 — the engine cannot escalate it without changing engine logic (out of
# scope for a data-only fix). The `\`-rooted form below is the faithful path-escape case that the
# resolver actually escalates, preserving the "read a sensitive out-of-tree file" intent at >= 2.
[[entry]]
command = "cat \\Windows\\System32\\config\\SAM"
expected_tier = 2
category = "path-tricks"

[[entry]]
command = "ls C:\\"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "New-Item -ItemType SymbolicLink -Path link -Target C:\\Windows"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "mklink /D link C:\\Windows"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "copy ..\\..\\secrets.env ."
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "cargo test --manifest-path ../../Cargo.toml"
expected_tier = 2
category = "path-tricks"

[[entry]]
command = "cargo test --manifest-path=../../Cargo.toml"
expected_tier = 2
category = "path-tricks"

[[entry]]
command = "cmake -B C:\\evil"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "cmake -BC:\\evil"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "cargo test --manifest-path C:\\Windows\\Cargo.toml"
expected_tier = 3
category = "path-tricks"

[[entry]]
command = "cargo test"
expected_tier = 1
category = "path-tricks"

[[entry]]
command = "cmake --build ."
expected_tier = 1
category = "path-tricks"

