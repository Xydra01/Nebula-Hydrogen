# Nebula daemon defaults, embedded in the binaries by nebula-config. Local changes go in
# F:\Nebula\config\nebula.toml (or the file named by NEBULA_CONFIG), which is merged over this.
# Model profiles come from ADR-004 and ADR-006; `standard` matches bench/profiles/pq2mtp.toml.

[paths]
data_root = 'F:\Nebula'
logs = 'F:\Nebula\logs'
state = 'F:\Nebula\state'
config = 'F:\Nebula\config'
archive = 'D:\NebulaCold\logs-archive'
backups_local = 'D:\NebulaCold\backups-local'

[backup]
rclone = "rclone"
rclone_config = 'F:\Nebula\config\rclone.conf'
auth_remote = "gdrive:"
remote = "gdrive-crypt:"
# The Google app is unpublished (Testing), so its sign-in expires 7 days after
# `nebula backup reauth`. Set to 0 once it is published or for a key-based remote.
token_lifetime_days = 7
token_warn_days = 2
# Retention approved 2026-10-04 (PHASE0_PLAN 7.1).
keep_recent = 8
keep_daily = 14
keep_weekly = 8
keep_monthly = 6
local_keep_days = 7
# Deleting more than this asks first (Phase 0 delete rule).
max_delete_files = 500
max_delete_mib = 1024

[telemetry]
filter = "info"

[daemon]
pipe_name = "nebula"
# Profile loaded at startup; "" starts with no model.
load_on_start = "standard"
# CPU embedding server; "" disables it.
embedding_profile = "embedding"
# Credential Manager targets whose values are masked in every log and blob.
secrets = ["nebula/github_bot_token", "nebula/cursor_api_key", "nebula/rclone_config_pass", "nebula/ntfy_token"]

[resources]
sample_interval_ms = 2000
log_interval_s = 30
# Free commit charge kept on top of a profile's estimate before it may load.
commit_margin_mib = 1024
vram_headroom_warn_mib = 1024
# Hot logs on F: (7 days) and the archive cap on D:.
log_budget_gb = 2
archive_cap_gb = 8
# The failing drive that must not come back into use (PHASE0_PLAN 3.1).
retired_drive = "C:"

# Disk guard (PHASE0_PLAN 3.2). Phase 0 reports these; enforcement comes with tasks in Phase 1.
[[resources.volumes]]
mount = 'F:\'
warn_gb = 30
block_gb = 20
pause_gb = 12

[[resources.volumes]]
mount = 'D:\'
warn_gb = 50
block_gb = 25

[model]
default_profile = "standard"

[model.runtimes]
llama-prism = 'F:\Nebula\runtime\llama-prism\b10743-adfffbe\llama-server.exe'
llama-stock = 'F:\Nebula\runtime\llama-stock\b11342\llama-server.exe'

# PQ2_0 + MTP head, q4_0 KV at 32K (ADR-006).
[model.profiles.standard]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b-mtp\Ternary-Bonsai-2-27B-PQ2_0-MTP-Q8_0.gguf'
ctx = 32768
kv_type = "q4_0"
# Measured 2026-10-04: on WDDM, llama-server commits about as much as it uses in VRAM.
commit_estimate_mib = 10700
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    # The default allows every origin, so any web page could drive the local server.
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.standard.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.standard.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# PTQ1_0, q4_0 KV + bias at 128K (ADR-004). Expect ~3 min to ingest 120K tokens cold.
[model.profiles.long]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0.gguf'
ctx = 131072
kv_type = "q4_0"
kv_bias = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0-kv-bias.gguf'
# Not measured; 10.2 GB VRAM (ADR-004) plus the same margin as `standard`.
commit_estimate_mib = 10700
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.long.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.long.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# PTQ1_0, q4_0 KV + bias at 16K, for contested VRAM (ADR-004).
[model.profiles.lean]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0.gguf'
ctx = 16384
kv_type = "q4_0"
kv_bias = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0-kv-bias.gguf'
# Not measured; below the 7.97 GB of q4_0 at 32K (ADR-004), rounded up.
commit_estimate_mib = 8500
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.lean.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.lean.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# CPU-only embedding server (PHASE0_PLAN 3.5, bench/profiles/embedding.toml). Runs as its own
# supervised server next to the chat model; inputs are capped at 1024 tokens.
[model.profiles.embedding]
runtime = "llama-stock"
model = 'F:\Nebula\models\embedding\Qwen3-Embedding-0.6B-Q8_0.gguf'
ctx = 1024
kv_type = "f16"
embedding = true
# 1.2-1.8 GB measured (PHASE0_PLAN 3.5), rounded up.
commit_estimate_mib = 2400
flags = [
    "--embedding",
    "--pooling", "last",
    "--device", "none",
    "-ngl", "0",
    "-t", "8",
    "-np", "1",
    "-b", "1024",
    "-ub", "1024",
    "-fa", "on",
    "-lv", "4",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
]

# MCP tool servers (ADR-002, Phase 1). Each entry is a stdio MCP server the daemon launches in
# a Job Object and calls tools on. Empty by default; add servers in the local override
# (F:\Nebula\config\nebula.toml). Example:
#
#   [tools.servers.filesystem]
#   command = 'F:\Nebula\tools\mcp-filesystem.exe'
#   args = ["--root", 'F:\Nebula\worktrees']
#   call_timeout_ms = 30000
#   max_output_bytes = 1048576
#   env = [["RUST_LOG", "info"]]
#
# nebula-devtools (issue #33) is the first Python MCP tool server: build/test/lint adapters
# (test.run, build.run, lint.run) for Python (uv/pytest/ruff) and Rust (cargo build/nextest/
# clippy). It is a uv-managed package under tools\nebula-devtools; launch it with uv so the
# project's own virtualenv and dev deps are used. NEBULA_RETIRED_DRIVE lets the server reject
# any path that resolves onto the retired drive (default C:); keep it aligned with
# resources.retired_drive above.
#
#   [tools.servers.devtools]
#   command = "uv"
#   args = ["run", "--project", 'F:\Nebula\tools\nebula-devtools', "nebula-devtools"]
#   call_timeout_ms = 600000
#   max_output_bytes = 1048576
#   env = [["NEBULA_RETIRED_DRIVE", "C:"]]
[tools]

# In-process built-in tools (fs.*, git.*, shell.run, system.resources). These run inside the
# daemon rather than as external MCP servers, so they are configured here instead of under
# [tools.servers].
[tools.builtin]
# Confinement root for file and shell tools. Every path a built-in touches is canonicalized and
# must resolve inside this directory; a path escaping it is rejected. Defaults to the current
# directory; set it to a dedicated worktree root in the local override.
worktree_root = "."
# Per-call timeout in seconds. A built-in call running longer than this is cancelled and returns
# a timeout error. Clamped to 1..=600 seconds.
call_timeout_secs = 30
# Largest inline output in bytes; output beyond this is truncated (with a marker) and the full
# output is preserved in a blob.
output_cap_bytes = 65536

[sandbox]
# Optional path to an external command-classification rules table (TOML). When empty (the
# default), the rules table embedded in the binary is used. Editing the embedded table
# (crates/nebula-sandbox/src/data/rules.toml) requires rebuilding and reinstalling the binaries
# for the change to take effect — the same lock-file gotcha documented in AGENTS.md. Loading an
# external table from a non-empty path is not yet wired; the field exists for local experiments.
rules_table_path = ""

# Per-task git worktrees (issue #29). Each task runs in its own worktree and branch so concurrent
# tasks are isolated and the owner's main checkout is never modified.
[worktree]
# Parent directory for all per-task worktrees. Must be on the hot drive and never on the retired
# drive. Each task's worktree is created at <worktrees_dir>\<task-id>.
worktrees_dir = 'F:\Nebula\worktrees'
# Branch-name format for a task's branch. The `{task_id}` placeholder is replaced with the task
# id. The `nebula/` prefix keeps task branches clear of the owner's own feat/*/fix/* branches and
# lets issue #36's bot pull-request flow filter on it.
branch_name_format = "nebula/{task_id}"

# Optional per-task resource caps (issue #30), enforced via the Windows Job Object that supervises
# a task's processes. Both caps are OFF by default in Phase 1 (0 = no cap): VRAM and commit charge
# are already tight, so a wrong default could kill a legitimate build. The executor may override
# these per task; the memory cap is range-checked against installed physical memory at task start.
[tasks]
# Committed-memory cap per task, in mebibytes. 0 = no cap.
memory_limit_mib = 0
# Whether the memory cap applies to each member process ("process") or the whole task ("job").
memory_limit_scope = "job"
# Hard CPU-rate cap per task, as a percentage 1..=100. 0 = no cap.
cpu_rate_percent = 0

# Autonomous single executor loop (issue #32).
[executor]
# Maximum tool calls per task before stopping cleanly as limit_reached.
max_tool_calls = 50
# Maximum cumulative model tokens per task across all turns before stopping as limit_reached.
max_tokens = 65536
# Wall-clock timeout in seconds per task before stopping cleanly as limit_reached.
wall_time_secs = 600
# Default chat profile for executor tasks; empty uses the active profile.
default_profile = ""

# GitHub flow: automated bot branch push and PR creation (issue #36).
[github]
# Whether to automatically push the task branch and open a PR upon successful task completion.
enabled = false
# Target repository in "owner/repo" format.
repo = "Xydra01/Nebula"
# Base branch to target for PRs. Pushes to this branch are refused in code.
base_branch = "main"
# Expected branch prefix for task branches (e.g. "nebula/"). Push refuses branches without this prefix.
branch_prefix = "nebula/"
# Credential Manager target containing the GitHub bot token.
token_target = "nebula/github_bot_token"
# GitHub bot username for user-agent, author attribution, and PR search.
bot_username = "Nebula-dev-bot"

# Circuit breakers: safety stops and runaway detection (issue #34).
[circuit_breakers]
# Maximum consecutive identical tool failures before tripping breaker.
max_repeated_tool_failures = 3
# Maximum edits to the same file in a single task before tripping breaker.
max_file_edits = 5
# Maximum tokens in a single step before tripping runaway token breaker.
runaway_step_tokens = 16384

# Game mode detection and GPU yielding (issue #35, design Section 2.6).
[game_mode]
# Whether automatic game-mode monitoring is enabled.
enabled = true
# Poll interval in seconds for checking foreground window and GPU processes.
poll_interval_s = 2
# VRAM threshold in MiB held by a non-Nebula process to trigger game mode (2 GB).
vram_threshold_mib = 2048
# Resume cooldown in seconds after a game exits before reloading model and resuming tasks.
cooldown_secs = 10
# Known game processes or launcher executables.
known_processes = []
# Allowlist of normal desktop apps that should never trigger game mode.
desktop_allowlist = [
    "dwm.exe",
    "explorer.exe",
    "cursor.exe",
    "code.exe",
    "firefox.exe",
    "chrome.exe",
    "msedge.exe",
    "discord.exe",
    "slack.exe",
    "windowsterminal.exe",
    "powershell.exe",
    "cmd.exe",
    "taskmgr.exe",
    "llama-server.exe",
]

# Remote push notifications over Tailscale via ntfy (issue #37, design Section 4.5).
[notifications]
# Whether push notifications are enabled.
enabled = false
# ntfy server URL (e.g. "http://100.x.y.z:8080" or "http://127.0.0.1:8080").
server_url = "http://127.0.0.1:8080"
# ntfy topic name. Private topic on your tailnet-only ntfy server.
topic = "nebula-alerts"
# Credential Manager target containing an optional authentication token for ntfy.
token_target = "nebula/ntfy_token"
# When true, strictly restricts destination server_url to Tailscale IPs (100.64.0.0/10, fd7a:115c:a1e0::/48),
# MagicDNS hostnames (*.ts.net), or local loopback. Rejects public internet servers to prevent leaking alerts.
tailscale_only = true
# Request timeout in seconds for publishing notifications.
timeout_secs = 5
# Base URL for the tailnet-only approval page (e.g. "http://ej-pc.tailnet:8080/approve").
approval_url_base = ""
# Minimum interval in minutes between periodic doctor health checks/alerts.
doctor_alert_interval_mins = 60
